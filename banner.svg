<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="Janapriya — sunset over a lake with ducks and flowers" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .bob{animation:bob 3.2s ease-in-out infinite}
    .d2{animation-delay:-1s}.d3{animation-delay:-2s}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
    .swim{animation:swim 18s ease-in-out infinite alternate}
    @keyframes swim{from{transform:translateX(0)}to{transform:translateX(90px)}}
    .sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 4s ease-in-out infinite}
    .s2{animation-duration:5s;animation-delay:-2s}.s3{animation-duration:4.6s;animation-delay:-1s}
    @keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
    .shim{animation:shim 3s ease-in-out infinite}.t2{animation-delay:-1.5s}
    @keyframes shim{0%,100%{opacity:.9}50%{opacity:.35}}
    @media (prefers-reduced-motion:reduce){.bob,.swim,.sway,.shim{animation:none}}
  </style>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9b8f0"/><stop offset=".45" stop-color="#ffc2d6"/><stop offset=".75" stop-color="#ffd7bd"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6b3c8"/><stop offset="1" stop-color="#c595d4"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1c9"/><stop offset="1" stop-color="#ff9fb5"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1280" height="340" rx="28"/></clipPath>
    <clipPath id="above"><rect width="1280" height="236"/></clipPath>
    <clipPath id="sunc"><circle cx="640" cy="236" r="118"/></clipPath>
    <g id="duck">
      <ellipse rx="30" ry="15" fill="#fffaf2"/>
      <path d="M-30 -4 Q-43 -15 -36 4 Z" fill="#fffaf2"/>
      <path d="M-12 -5 Q4 -14 16 -3 Q2 5 -12 -5 Z" fill="#f2e6dc"/>
      <circle cx="20" cy="-18" r="11.5" fill="#fffaf2"/>
      <path d="M30 -20 L43 -16 L30 -12 Z" fill="#f59e4b"/>
      <circle cx="23" cy="-21" r="2" fill="#3f1d38"/>
    </g>
    <g id="duckling">
      <ellipse rx="15" ry="9" fill="#ffd866"/>
      <circle cx="11" cy="-10" r="7" fill="#ffd866"/>
      <path d="M17 -11 L24 -9 L17 -7 Z" fill="#f59e4b"/>
      <circle cx="13" cy="-12" r="1.4" fill="#3f1d38"/>
    </g>
    <g id="daisy">
      <g fill="#fff">
        <ellipse cy="-9" rx="4" ry="8"/><ellipse cy="9" rx="4" ry="8"/><ellipse cx="-9" rx="8" ry="4"/><ellipse cx="9" rx="8" ry="4"/>
        <ellipse cx="-6.5" cy="-6.5" rx="4" ry="7" transform="rotate(-45 -6.5 -6.5)"/><ellipse cx="6.5" cy="6.5" rx="4" ry="7" transform="rotate(-45 6.5 6.5)"/>
        <ellipse cx="6.5" cy="-6.5" rx="4" ry="7" transform="rotate(45 6.5 -6.5)"/><ellipse cx="-6.5" cy="6.5" rx="4" ry="7" transform="rotate(45 -6.5 6.5)"/>
      </g>
      <circle r="5" fill="#ffc94a"/>
    </g>
    <path id="tulip" d="M-11 -5 Q-13 -26 -5 -29 L0 -19 L5 -29 Q13 -26 11 -5 Q0 3 -11 -5 Z"/>
    <g id="bloom">
      <circle cy="-7" r="6"/><circle cx="7" cy="-2" r="6"/><circle cx="4" cy="6" r="6"/><circle cx="-4" cy="6" r="6"/><circle cx="-7" cy="-2" r="6"/>
      <circle r="4" fill="#ffd866"/>
    </g>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="340" fill="url(#sky)"/>
    <g fill="#fff" opacity=".55">
      <ellipse cx="190" cy="80" rx="110" ry="14"/><ellipse cx="250" cy="68" rx="60" ry="12"/>
      <ellipse cx="1090" cy="64" rx="130" ry="16"/><ellipse cx="1030" cy="52" rx="70" ry="12"/>
    </g>
    <g clip-path="url(#above)">
      <circle cx="640" cy="236" r="118" fill="url(#sun)"/>
      <g fill="#ffc2d6" clip-path="url(#sunc)"><rect x="500" y="192" width="280" height="5"/><rect x="500" y="208" width="280" height="7"/><rect x="500" y="224" width="280" height="9"/></g>
    </g>
    <path d="M0 206 Q160 170 320 198 T640 196 T960 186 T1280 200 V238 H0 Z" fill="#e79fbd" opacity=".8"/>
    <path d="M0 222 Q220 198 440 220 T880 216 T1280 212 V238 H0 Z" fill="#c983b4" opacity=".8"/>
    <rect y="236" width="1280" height="104" fill="url(#lake)"/>
    <g fill="#fff3d6">
      <rect class="shim" x="560" y="250" width="160" height="4" rx="2"/>
      <rect class="shim t2" x="590" y="266" width="100" height="3" rx="1.5"/>
      <rect class="shim" x="615" y="280" width="50" height="3" rx="1.5"/>
    </g>

    <!-- name -->
    <text x="640" y="118" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" fill="#3f1d38">Janapriya</text>
    <text x="640" y="160" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-style="italic" fill="#b02d5c">Prathap Gajalakshmi</text>

    <!-- ducks -->
    <g class="swim">
      <g transform="translate(330 292)"><g class="bob"><use href="#duck" xlink:href="#duck"/></g></g>
      <g transform="translate(270 302)"><g class="bob d2"><use href="#duckling" xlink:href="#duckling"/></g></g>
      <g transform="translate(226 308)"><g class="bob d3"><use href="#duckling" xlink:href="#duckling"/></g></g>
    </g>
    <g transform="translate(960 300) scale(-1 1)"><g class="bob d2"><use href="#duck" xlink:href="#duck"/></g></g>

    <!-- shore + flowers -->
    <path d="M0 322 Q90 306 170 318 L170 340 H0 Z" fill="#8fbf8a"/>
    <path d="M1100 320 Q1190 304 1280 314 V340 H1100 Z" fill="#8fbf8a"/>
    <g stroke="#5f9b6a" stroke-width="3.5" stroke-linecap="round">
      <path d="M40 336 v-50"/><path d="M85 338 v-64"/><path d="M128 336 v-40"/>
      <path d="M1150 336 v-46"/><path d="M1195 338 v-62"/><path d="M1240 336 v-42"/>
    </g>
    <g class="sway"><use href="#daisy" xlink:href="#daisy" x="40" y="284"/></g>
    <g class="sway s2" fill="#e2678f"><use href="#tulip" xlink:href="#tulip" x="85" y="278"/></g>
    <g class="sway s3" fill="#ff9fbf"><use href="#bloom" xlink:href="#bloom" x="128" y="294"/></g>
    <g class="sway s3" fill="#c88ae0"><use href="#tulip" xlink:href="#tulip" x="1150" y="294"/></g>
    <g class="sway"><use href="#daisy" xlink:href="#daisy" x="1195" y="274"/></g>
    <g class="sway s2" fill="#e2678f"><use href="#bloom" xlink:href="#bloom" x="1240" y="292"/></g>
  </g>
</svg>
