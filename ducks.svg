<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 120" width="1280" height="120" role="img" aria-label="A duck family swimming past flowers" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .bob{animation:bob 3.2s ease-in-out infinite}.d2{animation-delay:-1s}.d3{animation-delay:-2s}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
    .swim{animation:swim 22s linear infinite;animation-delay:-7s}
    @keyframes swim{from{transform:translateX(-200px)}to{transform:translateX(1400px)}}
    .sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 4s ease-in-out infinite}.s2{animation-delay:-2s}
    @keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
    @media (prefers-reduced-motion:reduce){.bob,.swim,.sway{animation:none}}
  </style>
  <defs>
    <linearGradient id="w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6b3c8"/><stop offset="1" stop-color="#c595d4"/></linearGradient>
    <clipPath id="f"><rect width="1280" height="120" rx="24"/></clipPath>
    <g id="duck">
      <ellipse rx="30" ry="15" fill="#fffaf2"/><path d="M-30 -4 Q-43 -15 -36 4 Z" fill="#fffaf2"/>
      <path d="M-12 -5 Q4 -14 16 -3 Q2 5 -12 -5 Z" fill="#f2e6dc"/><circle cx="20" cy="-18" r="11.5" fill="#fffaf2"/>
      <path d="M30 -20 L43 -16 L30 -12 Z" fill="#f59e4b"/><circle cx="23" cy="-21" r="2" fill="#3f1d38"/>
    </g>
    <g id="duckling">
      <ellipse rx="15" ry="9" fill="#ffd866"/><circle cx="11" cy="-10" r="7" fill="#ffd866"/>
      <path d="M17 -11 L24 -9 L17 -7 Z" fill="#f59e4b"/><circle cx="13" cy="-12" r="1.4" fill="#3f1d38"/>
    </g>
    <g id="bloom"><circle cy="-7" r="6"/><circle cx="7" cy="-2" r="6"/><circle cx="4" cy="6" r="6"/><circle cx="-4" cy="6" r="6"/><circle cx="-7" cy="-2" r="6"/><circle r="4" fill="#ffd866"/></g>
  </defs>
  <g clip-path="url(#f)">
    <rect width="1280" height="120" fill="#ffe0cf"/>
    <rect y="40" width="1280" height="80" fill="url(#w)"/>
    <g stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".4"><path d="M200 70 h50 M520 96 h40 M900 74 h60"/></g>
    <g class="swim">
      <g transform="translate(120 82)"><g class="bob"><use href="#duck" xlink:href="#duck"/></g></g>
      <g transform="translate(60 92)"><g class="bob d2"><use href="#duckling" xlink:href="#duckling"/></g></g>
      <g transform="translate(16 98)"><g class="bob d3"><use href="#duckling" xlink:href="#duckling"/></g></g>
    </g>
    <path d="M0 108 Q60 96 130 106 V120 H0 Z" fill="#8fbf8a"/><path d="M1150 106 Q1220 96 1280 104 V120 H1150 Z" fill="#8fbf8a"/>
    <g stroke="#5f9b6a" stroke-width="3" stroke-linecap="round"><path d="M40 118 v-38"/><path d="M90 118 v-28"/><path d="M1190 118 v-36"/><path d="M1240 118 v-26"/></g>
    <g class="sway" fill="#e2678f"><use href="#bloom" xlink:href="#bloom" x="40" y="78"/></g>
    <g class="sway s2" fill="#c88ae0"><use href="#bloom" xlink:href="#bloom" x="90" y="88"/></g>
    <g class="sway s2" fill="#ff9fbf"><use href="#bloom" xlink:href="#bloom" x="1190" y="80"/></g>
    <g class="sway" fill="#e2678f"><use href="#bloom" xlink:href="#bloom" x="1240" y="90"/></g>
  </g>
</svg>
